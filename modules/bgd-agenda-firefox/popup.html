<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BrasilGuard Agenda</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>BrasilGuard Agenda</h1>

    <section class="integration-card" aria-labelledby="google-title">
      <div>
        <h2 id="google-title">Google Agenda</h2>
        <p id="googleStatus">Verificando conexão...</p>
      </div>
      <button id="connectGoogle" type="button">Conectar Google Agenda</button>
    </section>

    <p class="required-note"><span class="required-mark">*</span> Campos obrigatórios</p>
    <form id="appointment-form" novalidate>
      <label>Cliente <span class="required-mark">*</span><input id="clientName" required maxlength="120" /></label>
      <label>WhatsApp <span class="required-mark">*</span><input id="clientPhone" required placeholder="5521999999999" /></label>
      <label>E-mail<input id="clientEmail" type="email" /></label>
      <label>Serviço <span class="required-mark">*</span><input id="serviceName" required maxlength="120" /></label>
      <label>Data e hora <span class="required-mark">*</span><input id="startsAt" type="datetime-local" required /></label>
      <label>Duração (min) <span class="required-mark">*</span><input id="durationMinutes" type="number" min="5" value="60" required /></label>
      <label><input id="allowReschedule" type="checkbox" checked /> Permitir reagendamento</label>
      <label>Até quantas horas antes?<input id="rescheduleLimitHours" type="number" min="0" value="6" /></label>
      <fieldset>
        <legend>Lembretes</legend>
        <label><input id="reminderEmail" type="checkbox" checked /> E-mail</label>
        <label><input id="reminderWhatsapp" type="checkbox" checked /> WhatsApp</label>
        <label><input id="reminderBrowser" type="checkbox" checked /> Firefox</label>
        <label>Minutos antes <span class="required-mark">*</span><input id="reminderMinutes" type="number" min="1" value="60" required /></label>
      </fieldset>
      <button type="submit">Salvar agendamento</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section>
      <h2>Próximos</h2>
      <div id="appointments"></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
