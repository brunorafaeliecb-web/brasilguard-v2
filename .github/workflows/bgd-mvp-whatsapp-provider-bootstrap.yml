name: BGD MVP WhatsApp - Provider Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: hnpwcffosfvpypglcscy
  SUPABASE_INGEST_URL: https://hnpwcffosfvpypglcscy.supabase.co/functions/v1/wa-ingest
  GEMINI_MODEL: gemini-3.5-flash

jobs:
  bootstrap-providers:
    name: Validate secrets, configure Supabase and deploy Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BGD_INGRESS_SECRET: ${{ secrets.BGD_INGRESS_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_GRAPH_VERSION: ${{ secrets.WHATSAPP_GRAPH_VERSION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}

    steps:
      - name: Checkout governed source
        uses: actions/checkout@v4

      - name: BGD fail-closed secret gate
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_ACCESS_TOKEN
            BGD_INGRESS_SECRET
            GEMINI_API_KEY
            WHATSAPP_ACCESS_TOKEN
            WHATSAPP_GRAPH_VERSION
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            WHATSAPP_VERIFY_TOKEN
            WHATSAPP_APP_SECRET
          )

          for key in "${required[@]}"; do
            value="${!key:-}"
            if [[ -z "$value" || "$value" == "mudeaquiasenha" ]]; then
              echo "::error::$key ausente ou ainda com placeholder BGD. Deploy bloqueado."
              exit 1
            fi
          done

          if [[ "$BGD_INGRESS_SECRET" == "$WHATSAPP_VERIFY_TOKEN" ]]; then
            echo "::warning::BGD_INGRESS_SECRET e WHATSAPP_VERIFY_TOKEN são iguais. Recomenda-se segredos distintos."
          fi

          echo "BGD secret gate: PASS"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Supabase Edge Function secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            BGD_INGRESS_SECRET="$BGD_INGRESS_SECRET" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            GEMINI_MODEL="$GEMINI_MODEL" \
            WHATSAPP_ACCESS_TOKEN="$WHATSAPP_ACCESS_TOKEN" \
            WHATSAPP_GRAPH_VERSION="$WHATSAPP_GRAPH_VERSION"

      - name: Deploy Cloudflare Worker and configure Worker secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mvp-whatsapp-serverless/cloudflare/worker
          command: deploy --config wrangler.toml.example
          secrets: |
            WHATSAPP_VERIFY_TOKEN
            WHATSAPP_APP_SECRET
            BGD_INGRESS_SECRET
            SUPABASE_INGEST_URL
        env:
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          BGD_INGRESS_SECRET: ${{ secrets.BGD_INGRESS_SECRET }}
          SUPABASE_INGEST_URL: ${{ env.SUPABASE_INGEST_URL }}

      - name: BGD provider bootstrap checkpoint
        shell: bash
        run: |
          echo "Supabase secrets configured: requested"
          echo "Cloudflare Worker deploy: requested"
          echo "No secret values printed"
          echo "Next gate: verify provider state and Meta webhook E2E"
