name: Historical secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all Git history
        run: |
          set -euo pipefail
          VERSION=8.24.3
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 1 .
